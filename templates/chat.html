{% extends "base.html" %}
{% block title %}ベッチ - {{ partner.nickname }}{% endblock %}

{% block content %}
<h2>{{ partner.nickname }}さん</h2>

<div class="chat-messages">
    {% for m in messages %}
    <div class="chat-message {% if m.sender_id == me %}chat-message-mine{% endif %}">
        <div class="chat-bubble">{{ m.body }}</div>
        <div class="chat-time">{{ m.created_at[11:16] }}</div>
    </div>
    {% endfor %}
</div>

<form method="post" class="chat-form">
    <input type="text" name="body" placeholder="メッセージ" autocomplete="off" required>
    <button type="submit">送信</button>
</form>

<p><a href="{{ url_for('chat_list') }}">戻る</a></p>

<script>
    var roomId = {{ room.room_id }};
    var lastId = {{ messages[-1].message_id if messages else 0 }};
    var box = document.querySelector('.chat-messages');

    function addMessage(m) {
        var wrap = document.createElement('div');
        wrap.className = 'chat-message' + (m.mine ? ' chat-message-mine' : '');
        var bubble = document.createElement('div');
        bubble.className = 'chat-bubble';
        bubble.textContent = m.body;
        var time = document.createElement('div');
        time.className = 'chat-time';
        time.textContent = m.created_at.slice(11, 16);
        wrap.appendChild(bubble);
        wrap.appendChild(time);
        box.appendChild(wrap);
    }

    setInterval(function () {
        fetch('/chat/' + roomId + '/new?after=' + lastId)
            .then(function (res) { return res.json(); })
            .then(function (list) {
                list.forEach(function (m) {
                    addMessage(m);
                    lastId = m.message_id;
                });
                if (list.length) {
                    window.scrollTo(0, document.body.scrollHeight);
                }
            });
    }, 3000);
</script>

{% endblock %}
