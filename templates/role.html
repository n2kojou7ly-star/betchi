{% extends "base.html" %}
{% block title %}ベッチ - 立場選択{% endblock %}

{% block content %}

    <h1 class="role-title">あなたはどっち?</h1>
    <p class="role-subtitle">今回はどちらとして使いますか</p>
    <form method="post" class="role-form">
        <button class="role-option" type="submit" name="role" value="teacher">先生</button>

    </form>
</div>
{% endblock %}
